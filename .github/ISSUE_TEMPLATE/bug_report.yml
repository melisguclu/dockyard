name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include screenshots that show private information. Dockyard logs application paths as private data, so system logs redact them by default.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5.2 (25F84)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model
      placeholder: MacBook Pro (M1, 2021)
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Every display, which one is primary, which one had the real Dock, and the arrangement.
      placeholder: Built-in plus Studio Display, Studio Display primary and to the right, real Dock on the Studio Display.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dockyard version
      placeholder: 1.0.0, or a commit hash for a source build
    validations:
      required: true
  - type: textarea
    id: dock-settings
    attributes:
      label: Dock settings
      description: Output of `defaults read com.apple.dock | grep -E 'tilesize|largesize|magnification|orientation|autohide|show-recents|show-process-indicators'`
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Output of `log show --last 5m --predicate 'subsystem == "com.dockyard.app"' --info`
      render: shell
